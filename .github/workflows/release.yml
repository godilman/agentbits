# Builds the Windows installer and the macOS DMG/ZIP (Apple Silicon + Intel).
# Runs by hand (Actions → "Build packages" → Run workflow) or when a tag like v0.2.0 is pushed.
# A pushed tag, or a "release_tag" entered when running it by hand, also creates a draft GitHub release
# with the files attached (only the owner sees drafts; publishing it creates the tag).
#
# Signing is optional: without these repository secrets the packages are built unsigned.
#   macOS : MAC_CSC_LINK (base64 of the Developer ID Application .p12), MAC_CSC_KEY_PASSWORD,
#           APPLE_API_KEY_BASE64 (the .p8 key, base64), APPLE_API_KEY_ID, APPLE_API_ISSUER   → notarization
#   Windows: WIN_CSC_LINK (base64 .pfx), WIN_CSC_KEY_PASSWORD   (only if your certificate is exportable)
name: Build packages

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'To also create a draft GitHub release, enter its version tag (e.g. v0.1.0). Leave empty to only build.'
        required: false
        default: ''
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      # Signing secrets are exported only when they exist (an empty CSC_LINK breaks electron-builder).
      - name: Signing certificate (only when the secret exists)
        shell: bash
        env:
          LINK: ${{ secrets.WIN_CSC_LINK }}
          PASS: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [ -n "$LINK" ]; then
            echo "CSC_LINK=$LINK" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"
          fi
      - run: npm run dist:win
      # SHA-256 of what is published, with the commit it was built from (compare after download).
      - name: Checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem release -File | Where-Object { $_.Extension -in '.exe', '.blockmap', '.yml' } | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" }
          ("commit $env:GITHUB_SHA" + "`n" + ($lines -join "`n")) | Out-File -Encoding utf8 release/SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: agentbits-windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/SHA256SUMS-windows.txt
          if-no-files-found: error

  macos:
    runs-on: macos-latest # Apple Silicon runner; the Intel build is packaged on it too
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # npm installs the terminal module only for the runner's CPU; add the Intel one for the x64 package.
      # (better-sqlite3 already ships both macOS binaries.)
      - run: npm install --no-save --force @lydell/node-pty-darwin-x64@1.2.0-beta.15
      - run: npm run typecheck
      - run: npm run test:unit
      # Signing / notarization secrets are exported only when they exist (an empty CSC_LINK breaks electron-builder).
      - name: Signing certificate and notarization key (only when the secrets exist)
        env:
          LINK: ${{ secrets.MAC_CSC_LINK }}
          PASS: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          KEY_B64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -n "$LINK" ]; then
            echo "CSC_LINK=$LINK" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"
          fi
          if [ -n "$KEY_B64" ]; then
            echo "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/apple-api-key.p8"
            echo "APPLE_API_KEY=$RUNNER_TEMP/apple-api-key.p8" >> "$GITHUB_ENV"
            echo "APPLE_API_KEY_ID=$KEY_ID" >> "$GITHUB_ENV"
            echo "APPLE_API_ISSUER=$ISSUER" >> "$GITHUB_ENV"
          fi
      - run: npm run dist:mac
      - name: Checksums
        run: |
          cd release && { echo "commit $GITHUB_SHA"; shasum -a 256 *.dmg *.zip *.blockmap latest-mac.yml; } > SHA256SUMS-macos.txt
      - uses: actions/upload-artifact@v4
        with:
          name: agentbits-macos
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
            release/SHA256SUMS-macos.txt
          if-no-files-found: error

  release:
    # The Windows package is required; the macOS package (not yet verified on a real Mac) is attached when it built.
    if: always() && needs.windows.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.release_tag, 'v'))
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        # A draft does not create the tag yet; publishing it creates the tag on the built commit (--target).
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title "Agentbits $TAG" --notes "Draft release. Fill in the notes from docs/RELEASE_TEMPLATE.md and check the SHA256SUMS files before publishing."
